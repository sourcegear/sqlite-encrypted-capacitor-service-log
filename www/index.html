<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12372f">
  <title>Encrypted Service Log</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="hero">
    <p class="eyebrow">SQLITE.ENCRYPTED + CAPACITOR</p>
    <h1>Encrypted Service Log</h1>
    <p>Keep customer visit notes private and available offline.</p>
  </header>

  <main>
    <section id="startup-card" class="card startup-card">
      <div id="activation-state" class="status pending">Initializing SQLite.Encrypted…</div>
      <h2>Open your service log</h2>
      <p class="muted">Enter the database passphrase. It stays in memory only while the app is running.</p>
      <label for="database-key">Database passphrase</label>
      <input id="database-key" type="password" autocomplete="off" placeholder="Passphrase for this device">
      <button id="open-button" class="primary" disabled>Open encrypted log</button>
      <p id="startup-error" class="error" hidden></p>
    </section>

    <section id="workspace" hidden>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search customer, location, or notes">
        <button id="new-button" class="primary compact">New visit</button>
      </div>

      <div class="workspace-grid">
        <section class="card list-card">
          <div class="section-heading">
            <h2>Visits</h2>
            <span id="visit-count">0</span>
          </div>
          <div id="visit-list" class="visit-list"></div>
        </section>

        <section class="card editor-card">
          <div class="section-heading">
            <div>
              <p class="eyebrow dark">VISIT EDITOR</p>
              <h2 id="editor-heading">New visit</h2>
            </div>
            <button id="delete-button" class="danger" hidden>Delete</button>
          </div>
          <label for="customer">Customer</label>
          <input id="customer" maxlength="120" placeholder="Customer or organization">
          <label for="location">Location</label>
          <input id="location" maxlength="160" placeholder="Visit location">
          <label for="notes">Notes</label>
          <textarea id="notes" rows="7" placeholder="Work performed, follow-up, or private notes"></textarea>
          <div class="editor-actions">
            <span id="editor-status" class="muted">Ready</span>
            <button id="save-button" class="primary">Save visit</button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="cordova.js"></script>
  <script src="js/config.js"></script>
  <script src="js/database.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
